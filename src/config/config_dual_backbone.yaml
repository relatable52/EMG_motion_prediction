# Dual-Backbone Configuration for Wavelet EMG + Angle Data

# Experiment settings
experiment_name: "dual_backbone_wavelet"
seed: 42
device: "cuda"  # or "cpu"

# Feature mode selection (CONFIGURABLE!)
feature_mode: "both"  # Options: "both", "emg_only", "angle_only"

# Target angles to predict
target_angle_name:
  - "knee_angle_r"
  - "knee_angle_l"

# Data processing parameters
sample_window_length: 1.0  # seconds
prediction_horizon: 0.5    # seconds
sample_stride: 0.05         # seconds
use_cache: true

# Wavelet parameters (in dataset)
# These are set in PredictionDataset: output_fs=100, freq_min=20, freq_max=450, n_scales=40

# Model architecture
backbone: "DualBackbone"  # New dual-backbone type
prediction_type: "deterministic"  # or "probabilistic"

model_spec:
  # EMG scalogram backbone
  emg_backbone_type: "conv2d_lstm"  # Options: "conv2d_lstm", "flatten_lstm"
  emg_hidden_dim: 128
  
  # Angle history backbone
  angle_backbone_type: "tcn"  # Options: "lstm", "tcn"
  angle_hidden_dim: 64
  
  # Fusion layer
  fusion_hidden_dim: 128
  
  # Legacy parameters (for backward compatibility with old single-backbone configs)
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  kernel_size: 3

# Training hyperparameters
batch_size: 64
learning_rate: 0.0002
epochs: 25
early_stopping_patience: 10

# Logging and saving
log_interval: 5
save_best_model: true
save_last_model: true

# Results directory
results_dir: "./results"
