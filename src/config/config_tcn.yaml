# TCN Configuration for Gait Analysis
# Optimized hyperparameters for Temporal Convolutional Network

experiment_name: "tcn_deterministic"
seed: 42
device: "cuda"

target_angle_name:
  - knee_angle_r
  - knee_angle_l

# Data Processing
use_cache: true
sample_window_length: 1.0
prediction_horizon: 0.5
sample_stride: 0.1

# Training
batch_size: 128
learning_rate: 0.001
epochs: 50
early_stopping_patience: 10

# Model
backbone: "TCN"
prediction_type: "deterministic"

model_spec:
  hidden_size: 128
  kernel_size: 5
  dropout: 0.2

features_used: "all"

# Logging
log_interval: 1

# Model Saving
save_best_model: true
save_last_model: true
