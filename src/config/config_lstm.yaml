# LSTM Configuration for Gait Analysis
# Optimized hyperparameters for LSTM backbone

experiment_name: "lstm_deterministic"
seed: 42
device: "cuda"

target_angle_name:
  - knee_angle_r
  - knee_angle_l

# Data Processing
use_cache: true
sample_window_length: 1.0
prediction_horizon: 0.5
sample_stride: 0.1

# Training
batch_size: 64
learning_rate: 0.0001
epochs: 50
early_stopping_patience: 10

# Model
backbone: "LSTM"
prediction_type: "deterministic"

model_spec:
  hidden_size: 128
  num_layers: 2
  dropout: 0.3

features_used: "all"

# Logging
log_interval: 1

# Model Saving
save_best_model: true
save_last_model: true
save_step: 5
